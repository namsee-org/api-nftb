# ──────────────────────────────────────────────────────────────
# golangci-lint v2 configuration
# Follows Zalando engineering best practices for Go
# https://golangci-lint.run/usage/configuration/
# ──────────────────────────────────────────────────────────────

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

output:
  formats:
    text:
      path: stdout
      color: true
  sort-order:
    - linter
    - file

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    # ── Bug Detection ──────────────────────────────────────
    - errcheck          # Check for unchecked errors
    - gosec             # Security-oriented linting
    - bodyclose         # Check HTTP response body is closed
    - nilerr            # Check nil error returns
    - sqlclosecheck     # Check sql.Rows/Stmt are closed

    # ── Code Style ─────────────────────────────────────────
    - revive            # Extensible linter (replaces golint)
    - misspell          # Check for misspelled words
    - unconvert         # Remove unnecessary type conversions

    # ── Code Quality ───────────────────────────────────────
    - govet             # Vet examines Go source code
    - staticcheck       # Comprehensive static analysis
    - ineffassign       # Detect ineffectual assignments
    - unused            # Check for unused code
    - prealloc          # Suggest preallocations
    - gocritic          # Opinionated Go linter

    # ── Complexity ─────────────────────────────────────────
    - cyclop            # Check cyclomatic complexity
    - gocognit          # Check cognitive complexity
    - funlen            # Check function length

    # ── Error Handling ─────────────────────────────────────
    - wrapcheck         # Check errors are wrapped
    - errorlint         # Check error comparisons and type assertions

linters-settings:
  cyclop:
    max-complexity: 15

  gocognit:
    min-complexity: 20

  funlen:
    lines: 80
    statements: 50

  revive:
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"
      - name: unused-parameter
      - name: unreachable-code
      - name: context-as-argument
      - name: error-return
      - name: error-naming

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance

  wrapcheck:
    ignore-sigs:
      - ".Errorf("
      - "errors.New("
      - "errors.Join("

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  exclude-dirs:
    - vendor
    - third_party
  exclude-generated-strict: true
